name: Validate ATG Control Service

on:
  pull_request:
    paths:
      - ".github/workflows/atg-control.yml"
      - "contracts/**"
      - "services/control/**"
      - "workers/java17-maven/**"
  push:
    branches: [main]
    paths:
      - ".github/workflows/atg-control.yml"
      - "contracts/**"
      - "services/control/**"
      - "workers/java17-maven/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17.6-alpine
        env:
          POSTGRES_USER: atg
          POSTGRES_PASSWORD: atg-test-password
          POSTGRES_DB: atg
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U atg -d atg"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      ATG_TEST_DATABASE_URL: postgres://atg:atg-test-password@localhost:5432/atg?sslmode=disable
      ATG_TEST_LOCALWORKER_PROFILE: ${{ github.workspace }}/workers/java17-maven/profile.json
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: services/control/go.mod
          cache-dependency-path: services/control/go.mod
      - name: Check formatting, test, vet, and build
        working-directory: services/control
        run: make check
      - name: Race tests
        working-directory: services/control
        run: make race

  worker-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Build the shared worker image without publishing
        run: docker build --file workers/java17-maven/Containerfile --tag atg-java17-maven:ci workers/java17-maven
      - name: Check worker syntax and isolated runtime capabilities
        run: |
          bash -n workers/java17-maven/worker.sh
          docker run --rm --read-only --user 65532:65532 \
            --memory=3g --memory-swap=3g --cpus=2 --pids-limit=256 \
            --ulimit fsize=536870912:536870912 --ulimit nofile=1024:1024 \
            --cap-drop=ALL --security-opt=no-new-privileges --network=none \
            --tmpfs /work:rw,size=1536m,mode=1777 \
            --tmpfs /tmp:rw,size=64m,mode=1777 \
            atg-java17-maven:ci probe
