name: Validate ATG Control Service

on:
  pull_request:
    paths:
      - ".dockerignore"
      - ".github/workflows/atg-control.yml"
      - "contracts/**"
      - "services/control/**"
      - "services/generation-worker/**"
      - "workers/generation/**"
      - "workers/java17-maven/**"
  push:
    branches: [main]
    paths:
      - ".dockerignore"
      - ".github/workflows/atg-control.yml"
      - "contracts/**"
      - "services/control/**"
      - "services/generation-worker/**"
      - "workers/generation/**"
      - "workers/java17-maven/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17.6-alpine
        env:
          POSTGRES_USER: atg
          POSTGRES_PASSWORD: atg-test-password
          POSTGRES_DB: atg
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U atg -d atg"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      ATG_TEST_DATABASE_URL: postgres://atg:atg-test-password@localhost:5432/atg?sslmode=disable
      ATG_TEST_LOCALWORKER_PROFILE: ${{ github.workspace }}/workers/java17-maven/profile.json
      ATG_TEST_REPOSITORY_ASSETS: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: services/control/go.mod
          cache-dependency-path: services/control/go.mod
      - name: Check formatting, test, vet, and build
        working-directory: services/control
        run: make check
      - name: Race tests
        working-directory: services/control
        run: make race

  worker-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Build the shared worker image without publishing
        run: docker build --file workers/java17-maven/Containerfile --tag atg-java17-maven:ci workers/java17-maven
      - name: Check worker syntax and isolated runtime capabilities
        run: |
          bash -n workers/java17-maven/worker.sh
          docker run --rm --read-only --user 65532:65532 \
            --memory=3g --memory-swap=3g --cpus=2 --pids-limit=256 \
            --ulimit fsize=536870912:536870912 --ulimit nofile=1024:1024 \
            --cap-drop=ALL --security-opt=no-new-privileges --network=none \
            --tmpfs /work:rw,size=1536m,mode=1777 \
            --tmpfs /tmp:rw,size=64m,mode=1777 \
            atg-java17-maven:ci probe

  generation-worker:
    runs-on: ubuntu-latest
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONPATH: services/generation-worker/src
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Run SDK-free protocol and adapter tests
        run: python -m unittest discover -s services/generation-worker/tests -p 'test_*.py' -v
      - name: Check the shared generation entrypoint
        run: sh -n workers/generation/entrypoint.sh
      - name: Build the independent core wheel without harness extras
        run: python -m pip wheel --no-deps --wheel-dir "$RUNNER_TEMP/generation-wheels" services/generation-worker
      - name: Verify the installed core has no model dependency
        env:
          PYTHONPATH: ""
        run: |
          python -m venv "$RUNNER_TEMP/generation-core"
          "$RUNNER_TEMP/generation-core/bin/pip" install --no-deps "$RUNNER_TEMP"/generation-wheels/atg_generation_worker-*.whl
          "$RUNNER_TEMP/generation-core/bin/python" -m atg_generation_worker probe
      # Model SDK installs, generation image builds and live calls require a
      # separately approved base-image/configuration and are not CI side effects.
