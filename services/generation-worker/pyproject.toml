[build-system]
# PEP 621 project metadata requires a modern backend. Resolving/building this
# environment is a separate, explicitly permitted external operation.
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "atg-generation-worker"
version = "0.1.0"
description = "Independent bounded ATG generation-stage protocol worker"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
# Install in separate environments/images. The live adapter rejects co-installation.
pydantic-ai = ["pydantic-ai-slim[openai]==2.68.0"]
aider = ["aider-chat==0.86.2"]

[project.scripts]
atg-generation-worker = "atg_generation_worker.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]
